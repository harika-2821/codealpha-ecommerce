<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #102a56;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            color: #18bff5;
            font-size: 20px;
            margin: 15px 0;
        }

        #userArea {
            margin-top: 15px;
        }

        #userArea a,
        #userArea button {
            margin: 5px;
        }

        a {
            color: #0066cc;
            font-size: 18px;
        }

        button {
            border: none;
            background: #16aee0;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #078bb8;
        }

        #userArea button {
            background: #e74c3c;
        }

        #userArea button:hover {
            background: #c0392b;
        }

        .cart-section {
            background: white;
            margin: 30px auto;
            padding: 25px;
            width: 90%;
            max-width: 1100px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cart-section h2,
        .products-section h2 {
            text-align: center;
            color: #173b72;
        }

        #cart {
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout-btn {
            margin-top: 15px;
            background: #28a745;
        }

        .checkout-btn:hover {
            background: #218838;
        }

        .products-section {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .product {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product h3 {
            color: #173b72;
            font-size: 22px;
        }

        .product p {
            color: #555;
            line-height: 1.5;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
            color: #222;
        }

        @media (max-width: 900px) {
            #products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            #products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>🛒 Simple E-Commerce Store</h1>
        <p>Shop your favourite products</p>

        <!-- LOGIN / REGISTER / USER AREA -->
        <div id="userArea"></div>
    </header>


    <!-- SHOPPING CART -->
    <section class="cart-section">
        <h2>🛒 Shopping Cart</h2>

        <div id="cart">
            Your cart is empty.
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">
            Checkout
        </button>
    </section>


    <!-- PRODUCTS -->
    <section class="products-section">
        <h2>Our Products</h2>

        <div id="products"></div>
    </section>


    <!-- JAVASCRIPT -->
    <script>

        // ==========================================
        // USER LOGIN / LOGOUT
        // ==========================================

        const loggedInUser =
            localStorage.getItem("loggedinuser");

        const userArea =
            document.getElementById("userArea");

        if (loggedInUser) {

            userArea.innerHTML = `
                <span>
                    Welcome, ${loggedInUser}
                </span>

                <button onclick="logout()">
                    Logout
                </button>
            `;

        } else {

            userArea.innerHTML = `
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            `;
        }


        // LOGOUT
        function logout() {

            localStorage.removeItem("loggedinuser");

            window.location.href = "/";
        }


        // ==========================================
        // SHOPPING CART
        // ==========================================

        let cart = [];


        // ADD PRODUCT TO CART
        function addToCart(product) {

            cart.push(product);

            displayCart();
        }


        // DISPLAY CART
        function displayCart() {

            const cartElement =
                document.getElementById("cart");

            const totalElement =
                document.getElementById("total");

            if (cart.length === 0) {

                cartElement.innerHTML =
                    "Your cart is empty.";

                totalElement.innerText = "0";

                return;
            }


            let total = 0;

            cartElement.innerHTML = "";


            cart.forEach((item, index) => {

                total += item.price;

                const div =
                    document.createElement("div");

                div.className = "cart-item";

                div.innerHTML = `
                    <span>
                        ${item.name} - ₹${item.price}
                    </span>

                    <button onclick="removeFromCart(${index})">
                        Remove
                    </button>
                `;

                cartElement.appendChild(div);
            });


            totalElement.innerText = total;
        }


        // REMOVE FROM CART
        function removeFromCart(index) {

            cart.splice(index, 1);

            displayCart();
        }


        // ==========================================
        // LOAD PRODUCTS FROM SERVER
        // ==========================================

        async function loadProducts() {

            try {

                const response =
                    await fetch("/products");

                const products =
                    await response.json();

                const productsElement =
                    document.getElementById("products");

                productsElement.innerHTML = "";


                products.forEach(product => {

                    const div =
                        document.createElement("div");

                    div.className = "product";

                    div.innerHTML = `
                        <h3>${product.name}</h3>

                        <p>
                            ${product.description}
                        </p>

                        <p>
                            <strong>Category:</strong>
                            ${product.category}
                        </p>

                        <p class="price">
                            Price: ₹${product.price}
                        </p>

                        <button
                            onclick='addToCart(${JSON.stringify(product)})'>
                            Add to Cart
                        </button>
                    `;

                    productsElement.appendChild(div);
                });

            } catch (error) {

                console.error(
                    "Error loading products:",
                    error
                );

            }
        }


        // ==========================================
        // CHECKOUT
        // ==========================================

        async function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }
            const total=cart.reduce((sum,item)=>sum+item.price,0);
            try
            {
                const response=await fetch("/orders",{
                    method:"POST",
                    headers:{
                        "content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        items:cart,
                        total:total,
                        userId:
                        localStorage.getItem("loggediuser")
                    })
                });
                const data =
    await response.json();

if (response.ok) {

    alert(
        `Checkout successful! 🎉\n\n` +
        `Order ID: ${data.orderId}\n` +
        `Total Amount: ₹${total}`
    );

    cart = [];

    displayCart();

} else {

    alert(
        data.message ||
        "Checkout failed"
    );
}

} catch (error) {

    console.error(error);

    alert(
        "Something went wrong during checkout."
    );

}

}

// ==============================================
// START APPLICATION
// ==============================================
loadProducts();
displayCart();
</script>
</body>
</html>
