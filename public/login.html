<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        .login-box {
            width: 350px;
            margin: auto;
            padding: 30px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 30px;
            background: #2196f3;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

    <a href="/register.html">Create New Account</a>
    <a href="/">Back to Store</a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    });

    const data = await response.json();

    if (data.success) {
    //save logged-in user
    localStorage.setItem("loggedinuser",email);

        document.getElementById("message").innerText =
            "Login successful! 🎉";

        setTimeout(() => {
            window.location.href = "/";
        }, 1000);

    } else {

        document.getElementById("message").innerText =
            data.message || "Invalid email or password";

    }

});

</script>

</body>
</html>
